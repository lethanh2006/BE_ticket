# Render Blueprint: New > Blueprint > chọn repo này > Apply.
# Database là PostgreSQL ngoài (Neon): nhập DB_URL/DB_USERNAME/DB_PASSWORD một lần trên dashboard.
services:
  - type: web
    name: datve-lethanh-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://datve-lethanh.vercel.app
      - key: DEMO_ADMIN_PASSWORD
        sync: false
